name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src --ext .ts,.tsx
      - run: npx vitest run
      - run: npx tsup
      # Offline/hermetic E2E against the built CLI (dist/index.js). Needs NO secret —
      # the suite unsets LINEAR_API_KEY and sandboxes HOME/XDG; runs on both Node versions.
      - run: bash tests/scripts/test-config-override-cli.sh
      - run: bash tests/scripts/test-cursor-history-cli.sh
      - run: bash tests/scripts/test-comments-cli.sh
      - run: bash tests/scripts/test-label-lifecycle-cli.sh
