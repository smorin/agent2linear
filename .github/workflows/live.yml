name: Live (Linear API)

# Live integration tests against the REAL Linear API (throwaway test workspace).
# Trusted events ONLY — never `pull_request` — so LINEAR_API_KEY is never exposed to a
# fork/untrusted PR. The fast PR checks live in ci.yml (unit + offline E2E).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize live runs so concurrent merges don't interleave data or hammer the API;
# don't cancel a data-creating run mid-flight.
concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npx tsup # build dist/index.js (the suites invoke it)
      - name: Build locked TypeScript live suites
        run: ./node_modules/.bin/tsup --config tsup.live.config.ts
      # Fast auth smoke: `whoami` exits non-zero on a bad/rotated key, so this fails in
      # ~2s before the heavy suite runs. (`doctor` exits 0 on bad auth, so it is NOT used.)
      - name: Auth smoke (whoami)
        run: node dist/index.js whoami
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      # M34 is read-only and proves that raw cursor continuation reaches page two
      # and all remaining records in the exact ConceptM workspace. Run it before
      # mutating suites so their cleanup cannot create a read-after-write consistency race.
      - name: M34 raw-cursor pagination
        run: node tests/scripts/test-pagination-live.js
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      # M33 lifecycle verification fails closed unless both the Linear organization and
      # selected a2l workspace are exactly ConceptM. It creates only unique TEST_M33_* fixtures
      # and retries cleanup in a finally block.
      - name: M33 label and project lifecycle
        run: node .tmp/m36-live/test-label-lifecycle-live.js
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      # M35 creates disposable issue/project comments only after exact ConceptM
      # identity checks and removes its fixtures in a finally block.
      - name: M35 issue and project comments
        run: node .tmp/m36-live/test-comments-live.js
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      # M36 proves built-CLI issue automation and always trashes its exact disposable issue.
      - name: M36 issue automation
        run: node .tmp/m36-live/test-m36-issue-automation-live.js
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      # M34 plus the guarded M33, M35, and M36 harnesses above are the release-grade
      # live suite; mutating harnesses validate ConceptM and own disposable-fixture cleanup.
